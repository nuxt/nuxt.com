name: bundle-size-history

# Records the bundle of each commit on main at https://bundle.nuxt.dev/nuxt/nuxt.com/tree/main,
# which charts the size after each commit and compares any commit with the one before it.
on:
  push:
    branches:
      - main
  # Adds earlier commits to the history. Uploading a commit again replaces its run.
  workflow_dispatch:
    inputs:
      since:
        description: Analyze every commit on main since this date
        default: '2026-08-20'
      shas:
        description: Or only these commits on main, separated by spaces
        default: ''

permissions:
  contents: read

concurrency:
  # One backfill at a time, while every push gets its own run.
  group: ${{ github.event_name == 'workflow_dispatch' && 'bundle-size-history-backfill' || format('bundle-size-history-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # The first release with `upload --branch`.
  NUXT_BUNDLE_ANALYZER_VERSION: 0.1.4

jobs:
  commits:
    name: list commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shas: ${{ steps.list.outputs.shas }}
    steps:
      - name: Check out main
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: List commits
        id: list
        env:
          EVENT: ${{ github.event_name }}
          SINCE: ${{ inputs.since }}
          SHAS: ${{ inputs.shas }}
        run: |
          if [ "$EVENT" = push ]; then
            shas="$GITHUB_SHA"
          elif [ -n "$SHAS" ]; then
            # Only commits already on main, as their code runs in main's context, with its cache, and
            # their builds become main's history.
            shas=$(for sha in $SHAS; do
              full=$(git rev-parse --verify --quiet "$sha^{commit}") && git merge-base --is-ancestor "$full" HEAD \
                || { echo "::error::$sha is not a commit on main." >&2; exit 1; }
              echo "$full"
            done)
          else
            shas=$(git log --first-parent --reverse --format=%H --since="$SINCE 00:00" HEAD)
          fi
          count=$(printf '%s\n' $shas | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::No commits to analyze."
            exit 1
          fi
          # A matrix runs at most 256 jobs.
          if [ "$count" -gt 256 ]; then
            echo "::error::$count commits to analyze, more than the 256 a matrix can run. Pick a later date or list the commits."
            exit 1
          fi
          echo "Analyzing $count commits."
          echo "shas=$(printf '%s\n' $shas | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  analyze:
    name: analyze ${{ matrix.sha }}
    needs: commits
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        sha: ${{ fromJSON(needs.commits.outputs.shas) }}
    steps:
      # The layer that adds the analyzer comes from this workflow's commit, as older commits don't
      # have the version of it that does.
      - name: Check out the workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the commit to analyze
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .bundle-target
          persist-credentials: false
          ref: ${{ matrix.sha }}
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        env:
          npm_config_manage_package_manager_versions: "false"
        with:
          cache: true
          cache-dependency-path: .bundle-target/pnpm-lock.yaml
          working-directory: .bundle-target
      - name: Prepare the commit
        working-directory: .bundle-target
        run: pnpm nuxt prepare
      - name: Link the commit's Nuxt metadata
        run: ln -s .bundle-target/.nuxt .nuxt
      # Outside the app, so the commit needs no change to its lockfile.
      - name: Install nuxt-bundle-analyzer
        run: npm install --prefix "$RUNNER_TEMP/nuxt-bundle-analyzer" --no-save --ignore-scripts --no-audit --no-fund "nuxt-bundle-analyzer@$NUXT_BUNDLE_ANALYZER_VERSION"
      # Without --prerender, unlike bundle-size.yml: the PR comment reads the prerendered HTML, the
      # history only the reports, and an older commit can take twice as long with it.
      - name: Analyze the bundle
        working-directory: .bundle-target
        run: >-
          pnpm --package=@nuxt/cli-nightly@3.38.0-20260726-220626-c3c9e90
          dlx nuxt analyze
          --extends=../scripts/bundle-size/nuxt-layer
          --no-serve
          --logLevel=info
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          NUXT_TELEMETRY_DISABLED: 1
          NUXT_BUNDLE_ANALYZER_MODULE: ${{ runner.temp }}/nuxt-bundle-analyzer/node_modules/nuxt-bundle-analyzer/dist/module.mjs
          NUXT_BUNDLE_ANALYZER_NAME: main
      - name: Upload the bundle analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-history-${{ matrix.sha }}
          path: .bundle-target/node_modules/.cache/nuxt-bundle-analyzer/main
          if-no-files-found: error
          retention-days: 1

  # Apart from the builds, so the dependencies they install never run in a job that can prove to
  # bundle.nuxt.dev that it is this workflow.
  upload:
    name: upload
    needs:
      - commits
      - analyze
    # Commits that analyzed are uploaded even when others failed.
    if: ${{ !cancelled() && needs.commits.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Proves to bundle.nuxt.dev that the upload comes from this workflow on the default branch.
      id-token: write
    steps:
      # The upload reads each commit's message and time from git.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Download the bundle analyses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-history-*
          path: ${{ runner.temp }}/runs
      - name: Upload to bundle.nuxt.dev
        env:
          SHAS: ${{ needs.commits.outputs.shas }}
        run: |
          uploaded=0
          failed=0
          for sha in $(jq -r '.[]' <<< "$SHAS"); do
            if [ ! -f "$RUNNER_TEMP/runs/bundle-history-$sha/meta.json" ]; then
              echo "::warning::No analysis of $sha, so it's left out of the history."
              continue
            fi
            # One refused upload doesn't stop the others; the step fails at the end instead.
            if url=$(npx --yes "nuxt-bundle-analyzer@$NUXT_BUNDLE_ANALYZER_VERSION" upload . \
              --runs "$RUNNER_TEMP/runs" \
              --name "bundle-history-$sha" \
              --branch main \
              --sha "$sha" \
              --url https://bundle.nuxt.dev); then
              echo "- [\`${sha:0:7}\`]($url)" >> "$GITHUB_STEP_SUMMARY"
              uploaded=$((uploaded + 1))
            else
              echo "::error::The upload of $sha failed."
              failed=$((failed + 1))
            fi
          done
          echo "Uploaded $uploaded commits, $failed failed."
          if [ "$uploaded" -eq 0 ] || [ "$failed" -gt 0 ]; then
            exit 1
          fi
