shamefullyHoist: true
strictPeerDependencies: false

# TODO: drop with the comark overrides below once comarkdown/comark#486 ships.
blockExoticSubdeps: false

overrides:
  # TODO: back to the release once comarkdown/comark#486 ships.
  # Pinned to a commit: `@486` is republished on every push, which breaks the lockfile integrity.
  comark: https://pkg.pr.new/comark@f6772a0
  "@comark/vue": https://pkg.pr.new/@comark/vue@f6772a0
  "@comark/nuxt": https://pkg.pr.new/@comark/nuxt@f6772a0
  nostics: ^1.3.0
  # chat@4.34.0 pins the 4.1.0-beta.2 prerelease, flagged as a downgrade by check-provenance
  "@workflow/serde": 4.1.2

patchedDependencies:
  "@chat-adapter/discord@4.41.1": patches/@chat-adapter__discord@4.41.1.patch
  unstorage@1.17.5: patches/unstorage@1.17.5.patch

allowBuilds:
  esbuild: true
  rolldown: true
  sharp: true
  "@parcel/watcher": false
  maplibre-gl: false
  puppeteer: false
  unrs-resolver: false
  vue-demi: false
  zlib-sync: true

minimumReleaseAgeExclude:
  - eve@0.24.3 || 0.27.0 || 0.40.0
  - evlog
  - '@nuxt/*'
  - nuxt
  - nuxt-nightly
  - vue
  - '@vue/*'
  - nuxt-agent-discovery@0.5.0
  - cssnano-utils@8.2.0
  - "@nuxtjs/mcp-toolkit@0.24.1"
